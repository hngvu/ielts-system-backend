name: CI/CD Spring Boot to VPS with Postgres

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. BUILD PHASE
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 2. COPY TO VPS
      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "target/*.jar,Dockerfile,docker-compose.yml"
          target: "~/app"
          strip_components: 0

      # 3. VERIFY DOCKER-COMPOSE
      - name: Verify and install docker-compose if needed
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            if ! docker compose version &> /dev/null && ! command -v docker-compose &> /dev/null; then
              echo "📦 Installing docker-compose..."
              mkdir -p ~/.docker/cli-plugins 2>/dev/null || true
              curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o ~/.docker/cli-plugins/docker-compose
              chmod +x ~/.docker/cli-plugins/docker-compose
            fi
            docker compose version || docker-compose --version

      # 4. DEPLOY WITH DOCKER COMPOSE
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL: ${{secrets.DB_URL}}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,NVIDIA_API_KEY,GEMINI_API_KEY,ASSEMBLYAI_API_KEY
          script: |
            set -e
            cd ~/app

            echo "🚀 Starting Deployment..."
            
            # Chuẩn bị JAR file
            if [ -f target/*.jar ]; then
              mv target/*.jar app.jar
            fi

            # Tạo .env file (SỬA LỖI THỤT LỀ TẠI ĐÂY)
            cat > .env <<EOF
            SPRING_DATASOURCE_URL=$DB_URL
            SPRING_DATASOURCE_USERNAME=$DB_USERNAME
            SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD
            NVIDIA_API_KEY=$NVIDIA_API_KEY
            GEMINI_API_KEY=$GEMINI_API_KEY
            ASSEMBLYAI_API_KEY=$ASSEMBLYAI_API_KEY
            EOF
            
            chmod 600 .env
            
            echo "🧹 Cleaning up old containers..."
            docker compose down --remove-orphans 2>/dev/null || true
            
            echo "🔨 Building and Starting..."
            docker compose build app
            docker compose --env-file .env up -d
            
            echo "⏳ Waiting for services..."
            sleep 10
            
            # Kiểm tra nhanh app status
            docker compose ps
            
            # Dọn dẹp
            rm .env
            docker image prune -f
            echo "✅ Deployment completed!"

      # 5. VERIFY DEPLOYMENT
      - name: Verify deployment
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "🔍 Health Check:"
            curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "Failed"

      - name: Deployment failed - Show logs
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/app && docker compose logs app --tail=50