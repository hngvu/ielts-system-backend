name: CI/CD Spring Boot to VPS

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy Jar and Dockerfile to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "target/*.jar,Dockerfile"
          target: "~/app"
          strip_components: 0

      - name: Build and Run Docker on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{secrets.DB_PASSWORD}}
          NVIDIA_API_KEY: ${{secrets.NVIDIA_API_KEY}}
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
          ASSEMBLYAI_API_KEY: ${{secrets.ASSEMBLYAI_API_KEY}}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DB_PASSWORD,NVIDIA_API_KEY,GEMINI_API_KEY,ASSEMBLYAI_API_KEY
          script: |
            cd ~/app
            mv target/*.jar app.jar || true
            docker build -t moni-app:latest .
            docker stop moni-container || true
            docker rm moni-container || true
            docker run -d --name moni-container \
              -p 8080:8080 \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e NVIDIA_API_KEY="$NVIDIA_API_KEY" \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              -e ASSEMBLYAI_API_KEY="$ASSEMBLYAI_API_KEY" \
              --restart unless-stopped \
              moni-app:latest
            docker image prune -f