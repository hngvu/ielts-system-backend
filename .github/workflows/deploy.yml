name: CI/CD Spring Boot to Azure (Direct Copy)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy Jar and Dockerfile to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Chỉ copy file .jar vừa build xong và file Dockerfile
          source: "target/*.jar,Dockerfile"
          target: "~/app"
          strip_components: 0

      - name: Build and Run Docker on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/app
            # Di chuyển file jar ra thư mục gốc của app để Dockerfile dễ tìm
            mv target/*.jar app.jar || true
            
            # Build Image trực tiếp bằng tài nguyên của VM
            docker build -t my-spring-app:latest .
            
            # Dừng và xóa container cũ nếu đang chạy để tránh tranh chấp cổng 8080
            docker stop my-app-container || true
            docker rm my-app-container || true
            
            # Chạy bản mới
            docker run -d --name my-app-container -p 8080:8080 my-spring-app:latest
            
            # Dọn dẹp rác (image cũ) để tránh đầy ổ cứng 30GB của Azure
            docker image prune -f