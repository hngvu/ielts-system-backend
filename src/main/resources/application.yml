spring:
  application:
    name: moni
  servlet:
    multipart:
      max-file-size: 50MB       # Tăng giới hạn để upload được file Audio dài
      max-request-size: 50MB
  ai:
    openai:
      base-url: https://integrate.api.nvidia.com
      api-key: ${NVIDIA_API_KEY}
      chat:
        options:
          model: meta/llama-3.3-70b-instruct
    vertex:
      ai:
        gemini:
          api-endpoint: ${GEMINI_API_KEY}
          chat:
            options: gemini-3-flash-preview

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${UB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 300000
      keepalive-time: 60000
      connection-timeout: 10000
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

