spring:
  application:
    name: moni
  servlet:
    multipart:
      max-file-size: 50MB       # Tăng giới hạn để upload được file Audio dài
      max-request-size: 50MB
  ai:
    openai:
      base-url: https://integrate.api.nvidia.com
      api-key: ${NVIDIA_API_KEY}
      chat:
        options:
          model: meta/llama-4-maverick-17b-128e-instruct
    vertex:
      ai:
        gemini:
          api-endpoint: ${GEMINI_API_KEY}
          chat:
            options: gemini-3-flash-preview

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${UB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
        # Thời gian connection idle trước khi đóng (ms)
      idle-timeout: 300000       # 5 phút
        # Connection sống tối đa trước khi recycle (ms)
      max-lifetime: 1800000      # 30 phút
        # Thời gian chờ lấy connection trước khi timeout (ms)
      connection-timeout: 15000  # 15 giây
        # Thời gian check connection trước khi đưa ra sử dụng (ms)
      validation-timeout: 5000
        # Thời gian detect leak connection (ms)
      leak-detection-threshold: 240000
        # Giữ connection sống với DB ngay cả khi idle (ms)
      keepalive-time: 60000
        # Tên pool để dễ debug
      pool-name: HikariPool-1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  mvc:
    async:
      request-timeout: 240000

server:
  port: 8080
  tomcat:
    connection-timeout: 240000


