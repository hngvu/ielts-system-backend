version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: moni-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: moni_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G # Giới hạn RAM cho DB

  app:
    build: .
    container_name: moni-container
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # URL kết nối nội bộ giữa các container
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/moni_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
    deploy:
      resources:
        limits:
          memory: 2G # Giới hạn RAM cho App

volumes:
  postgres_data: